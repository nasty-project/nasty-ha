[project]
name = "nasty-ha"
version = "0.1.0"
description = "Home Assistant custom integration for NASty storage appliances"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"
authors = [{ name = "NASty contributors" }]
dependencies = ["aiohttp>=3.11"]

[project.optional-dependencies]
dev = [
  "homeassistant>=2026.9.3",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/nasty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/nasty"]
